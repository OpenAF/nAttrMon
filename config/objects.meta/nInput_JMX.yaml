kind: input
constructor: nInput_JMX
title: JMX
description: Collects JMX MBean attributes. A single result keeps its object shape; repeated rendered attribute names produce ordered arrays retaining each target key.
examples:
  - config/inputs.disabled/yaml/15.jmx.yaml
arguments:
  - name: attrTemplate
    type: string
    description: Attribute name template, with type and name from each MBean object name.
    example: "Java/JMX {{type}}"
  - name: chKeys
    type: string
    description: Channel containing JMX target keys and connection parameters.
    example: nattrmon::keys
  - name: objects
    type: array<object>
    description: JMX objects to collect; each entry may narrow the result with an nLinq selector and a JMESPath path.
    example: [ { object: "java.lang:type=Runtime", path: "{VmName:VmName,Uptime:Uptime}" } ]
    query:
      "[].selector": nlinq
      "[].path": jmespath
