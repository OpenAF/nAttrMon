kind: input
constructor: nInput_ChVals
title: ChVals
description: Configuration metadata for nInput_ChVals.
examples:
  - config/inputs.disabled/yaml/20.chvals.yaml
arguments:
  - name: attrTemplate
    type: any
    description: Configuration option read by nInput_ChVals.
    example: Category/Name
  - name: chName
    type: any
    description: Configuration option read by nInput_ChVals.
    example: {}
  - name: filter
    type: object
    description: nLinq query applied to the channel values (executed with nattrmon.filter).
    example: { where: [ { cond: equals, args: [ isFile, true ] } ] }
    query:
      ".": nlinq
  - name: full
    type: any
    description: Configuration option read by nInput_ChVals.
    example: {}
