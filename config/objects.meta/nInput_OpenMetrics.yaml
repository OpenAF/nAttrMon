kind: input
constructor: nInput_OpenMetrics
title: OpenMetrics
description: Collects OpenMetrics series. Singleton metric values keep their object shape; repeated names after filtering and renaming produce ordered arrays retaining labels and values.
examples:
  - config/inputs.disabled/yaml/30.openmetrics.yaml
arguments:
  - name: attrTemplate
    type: string
    description: Attribute name for the collected metric map or target maps.
    example: Category/Name
  - name: chKeys
    type: string
    description: Channel containing target keys and connection parameters.
    example: nattrmon::keys
  - name: connectionTimeout
    type: number
    description: HTTP connection timeout in milliseconds.
    example: 30000
  - name: excludePrefix
    type: array<string>
    description: Metric name prefixes to exclude.
    example: [process_]
  - name: excludeRE
    type: array<string>
    description: Regular expressions selecting metric names to exclude.
    example: ["_total$"]
  - name: headers
    type: object
    description: Additional HTTP request headers.
    example: { Accept: text/plain }
  - name: includePrefix
    type: array<string>
    description: Metric name prefixes to include.
    example: [http_]
  - name: includeRE
    type: array<string>
    description: Regular expressions selecting metric names to include.
    example: ["_bytes$"]
  - name: key
    type: string
    description: Target identity retained in each collected series.
    example: frontend
  - name: keys
    type: array<string>
    description: Target keys discovered from chKeys.
    example: [example-key]
  - name: login
    type: string
    description: HTTP authentication login.
    example: metrics-reader
  - name: metricsURI
    type: string
    description: Metrics endpoint path appended to url.
    example: /metrics
  - name: pass
    type: string
    secret: true
    description: HTTP authentication password.
    example: "$SECRET"
  - name: replace
    type: array<object>
    description: Ordered metric name replacements with pattern and replacement fields.
    example: [{ pattern: "^http_", replacement: "" }]
  - name: url
    type: string
    description: Target HTTP or HTTPS base URL.
    example: http://127.0.0.1:9090
