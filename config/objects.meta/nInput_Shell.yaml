kind: input
constructor: nInput_Shell
title: Shell
description: Configuration metadata for nInput_Shell.
examples:
  - tests/inputShellTest.yml
arguments:
  - name: attrTemplate
    type: any
    description: Configuration option read by nInput_Shell.
    example: Category/Name
  - name: chKeys
    type: any
    description: Configuration option read by nInput_Shell.
    example: nattrmon::keys
  - name: cmd
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: cmdEach
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: eachParseJson
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: eachParseYaml
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: keys
    type: any
    description: Configuration option read by nInput_Shell.
    example: [example-key]
  - name: kube
    type: object
    description: Kubernetes target; 'selector' narrows the listed items with an nLinq query, written either as a query map or as nLinq text.
    example: { kind: FPO, namespace: default, selector: "equals('metadata.namespace','default')" }
    query:
      selector: nlinqAny
  - name: name
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: parseJson
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: parseYaml
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: posExec
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
  - name: type
    type: any
    description: Configuration option read by nInput_Shell.
    example: {}
